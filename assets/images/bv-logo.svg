<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial & Linear Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180404" />
      <stop offset="50%" stop-color="#08080A" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D62828" />
    </linearGradient>

    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D62828" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.3" />
    </linearGradient>

    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D62828" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Dark Container Ring -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Border Glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#glowRing)" stroke-width="4" opacity="0.6" />

  <!-- Outer Vinyl Groove Details -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Center Artwork Disc -->
  <circle cx="256" cy="256" r="155" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="6" filter="url(#shadowGlow)" />

  <!-- BV Stylized Monogram & Audio Waves -->
  <g transform="translate(116, 140)">
    <!-- B Letter with Integrated Music Equalizer Bars -->
    <path d="M 20 20 L 75 20 C 110 20, 125 42, 115 68 C 108 85, 92 94, 75 96 C 100 98, 120 112, 120 142 C 120 178, 90 190, 20 190 Z" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- V Letter with Sharp Modern Angles & Play Triangle Geometry -->
    <path d="M 150 20 L 205 190 L 260 20" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Audio Waveform Pulsing Center Note Element -->
    <rect x="275" y="60" width="10" height="90" rx="5" fill="#F59E0B" />
    <rect x="293" y="40" width="10" height="130" rx="5" fill="#D62828" />
    <rect x="311" y="75" width="10" height="60" rx="5" fill="#FCD34D" />
  </g>
</svg>
